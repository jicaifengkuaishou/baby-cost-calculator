<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>余额</title>
  <style>
    :root {
      --red: #e8112d;
      --red-light: #fff0f2;
      --red-pill: #fde8eb;
      --gray-1: #f7f7f7;
      --gray-2: #eeeeee;
      --gray-4: #bbbbbb;
      --gray-6: #888888;
      --gray-9: #1a1a1a;
      --white: #ffffff;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 50px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'PingFang SC', sans-serif;
      background: var(--gray-1);
      color: var(--gray-9);
      min-height: 100vh;
    }

    /* ─── 顶部导航 ─── */
    .nav {
      background: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
    }
    .nav-back { font-size: 22px; color: var(--gray-9); background: none; border: none; cursor: pointer; padding: 4px; }
    .nav-title { font-size: 17px; font-weight: 600; }
    .nav-more { font-size: 22px; color: var(--gray-9); background: none; border: none; cursor: pointer; letter-spacing: -2px; }

    /* ─── 余额主卡 ─── */
    .balance-card {
      background: var(--white);
      margin: 10px 12px;
      border-radius: var(--radius-lg);
      padding: 20px 20px 16px;
    }
    .balance-label-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .balance-label { font-size: 14px; color: var(--gray-6); }
    .balance-eye { font-size: 16px; color: var(--gray-4); cursor: pointer; }
    .balance-protect {
      display: flex; align-items: center; gap: 3px;
      background: #fff5ec; border-radius: 12px; padding: 2px 8px;
      font-size: 11px; color: #ff6b00;
    }
    .balance-amount {
      font-size: 46px; font-weight: 700; color: var(--gray-9);
      line-height: 1.1; margin-bottom: 10px;
    }
    .balance-hint {
      font-size: 13px; color: var(--gray-6); margin-bottom: 18px;
      cursor: pointer;
    }
    .balance-hint strong { color: var(--red); }
    .balance-hint span { color: var(--gray-4); }

    /* 充值/提现按钮 */
    .balance-actions {
      display: flex; gap: 12px; margin-bottom: 16px;
    }
    .btn-recharge {
      flex: 1; height: 48px;
      background: var(--red); color: #fff;
      border: none; border-radius: var(--radius-pill);
      font-size: 17px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 14px rgba(232,17,45,0.3);
    }
    .btn-withdraw {
      flex: 1; height: 48px;
      background: var(--red-pill); color: var(--red);
      border: none; border-radius: var(--radius-pill);
      font-size: 17px; font-weight: 600; cursor: pointer;
    }

    /* 明细行 */
    .bill-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--gray-2);
    }
    .bill-left { display: flex; align-items: center; gap: 6px; }
    .bill-title { font-size: 14px; font-weight: 600; }
    .bill-desc { font-size: 13px; color: var(--gray-6); }
    .bill-earn { color: var(--red); font-weight: 500; }
    .bill-date { font-size: 12px; color: var(--gray-4); cursor: pointer; }
    .bill-date-arrow { color: var(--gray-4); }

    /* ─── 快捷功能宫格 ─── */
    .grid-card {
      background: var(--white);
      margin: 0 12px 10px;
      border-radius: var(--radius-lg);
      padding: 16px 8px 12px;
    }
    .grid-row { display: flex; justify-content: space-around; }
    .grid-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; min-width: 58px;
    }
    .grid-icon {
      width: 50px; height: 50px;
      border: 1.5px solid var(--gray-2); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--white);
    }
    .grid-icon.special { background: var(--red-light); border-color: #ffd0d8; }
    .grid-label { font-size: 12px; color: var(--gray-9); }
    /* 分页指示器 */
    .grid-pager {
      display: flex; justify-content: center; gap: 4px; margin-top: 10px;
    }
    .pager-dot {
      width: 16px; height: 4px; border-radius: 2px;
      background: var(--gray-2);
    }
    .pager-dot.active { background: var(--gray-4); }

    /* ─── 保险理财入口（"转小金库"对应位置新增） ─── */
    .insurance-banner {
      margin: 0 12px 10px;
      background: linear-gradient(135deg, #e8112d 0%, #ff6b4a 55%, #ffb86b 100%);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      position: relative; overflow: hidden;
      text-decoration: none;
    }
    .insurance-banner::before {
      content: '';
      position: absolute; top: -30px; right: -20px;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .ib-left {}
    .ib-tag {
      display: inline-flex; align-items: center; gap: 3px;
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 2px 10px; font-size: 11px; color: #fff;
      margin-bottom: 6px;
    }
    .ib-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .ib-desc { font-size: 12px; color: rgba(255,255,255,0.85); }
    .ib-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 1; }
    .ib-rate {
      font-size: 32px; font-weight: 800; color: #fff; line-height: 1;
    }
    .ib-rate-label { font-size: 11px; color: rgba(255,255,255,0.8); text-align: right; }
    .ib-btn {
      background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 16px; padding: 4px 12px;
      font-size: 12px; color: #fff; font-weight: 600; cursor: pointer;
    }
    /* 余额存入提示小条 */
    .earn-hint {
      font-size: 11px; color: rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.15); border-radius: 10px;
      padding: 3px 8px; margin-top: 4px; display: inline-block;
    }

    /* ─── 天天赚余额 ─── */
    .earn-card {
      background: var(--white);
      margin: 0 12px 10px;
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .earn-card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .earn-tabs {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .earn-tab {
      height: 28px; border-radius: 14px; padding: 0 14px;
      font-size: 13px; font-weight: 500; cursor: pointer; border: none;
    }
    .earn-tab.active { background: var(--red-pill); color: var(--red); }
    .earn-tab.inactive { background: var(--gray-1); color: var(--gray-6); }
    .earn-task-list { display: flex; flex-direction: column; gap: 0; }
    .earn-task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 0; border-bottom: 1px solid var(--gray-2);
    }
    .earn-task-item:last-child { border-bottom: none; }
    .earn-task-desc { font-size: 14px; color: var(--gray-9); }
    .earn-task-amount { font-size: 14px; color: var(--red); font-weight: 500; margin-left: 6px; }
    .earn-task-btn {
      height: 32px; border-radius: 16px; padding: 0 16px;
      border: 1px solid var(--gray-2); background: var(--white);
      font-size: 13px; color: var(--gray-9); cursor: pointer; white-space: nowrap;
    }
    .earn-more {
      text-align: center; font-size: 13px; color: var(--gray-4);
      padding: 12px 0 0; cursor: pointer;
    }

    /* ─── 余额享福利 ─── */
    .benefit-card {
      background: var(--white);
      margin: 0 12px 20px;
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .benefit-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 14px;
      opacity: 0; transition: opacity 0.25s; z-index: 9999;
      white-space: nowrap; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    .safe-bottom { height: calc(20px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
<div id="toast"></div>

<!-- 顶部导航 -->
<div class="nav">
  <button class="nav-back" onclick="history.back()">‹</button>
  <div class="nav-title">余额</div>
  <button class="nav-more">···</button>
</div>

<!-- 余额主卡 -->
<div class="balance-card">
  <div class="balance-label-row">
    <span class="balance-label">我的余额(元)</span>
    <span class="balance-eye" id="eye-btn" onclick="toggleBalance()">👁</span>
    <span class="balance-protect">🛡 资金保障中</span>
  </div>

  <div class="balance-amount" id="balance-display">452.7</div>

  <div class="balance-hint" onclick="goToInsurance()">
    转入小金保享 <strong id="hint-rate">1.80%</strong> 收益 <span>›</span>
  </div>

  <div class="balance-actions">
    <button class="btn-recharge" onclick="toast('充值功能即将上线')">充值</button>
    <button class="btn-withdraw" onclick="toast('提现功能即将上线')">提现</button>
  </div>

  <div class="bill-row">
    <div class="bill-left">
      <span class="bill-title">明细</span>
      <span class="bill-desc">签到返现-立返 <span class="bill-earn">+0.01</span></span>
    </div>
    <div class="bill-date">2024-10-20 <span class="bill-date-arrow">›</span></div>
  </div>
</div>

<!-- 快捷功能宫格 -->
<div class="grid-card">
  <div class="grid-row">
    <div class="grid-item" onclick="toast('转账功能即将上线')">
      <div class="grid-icon">⇄</div>
      <div class="grid-label">转账</div>
    </div>
    <div class="grid-item" onclick="toast('银行卡功能即将上线')">
      <div class="grid-icon">💳</div>
      <div class="grid-label">银行卡</div>
    </div>
    <div class="grid-item" onclick="toast('天天领余额活动进行中')">
      <div class="grid-icon special">🎁</div>
      <div class="grid-label">天天领余额</div>
    </div>
    <div class="grid-item" onclick="toast('充话费功能即将上线')">
      <div class="grid-icon">📱</div>
      <div class="grid-label">充话费</div>
    </div>
    <div class="grid-item" onclick="goToInsurance()">
      <div class="grid-icon special">🏦</div>
      <div class="grid-label">转小金保</div>
    </div>
  </div>
  <div class="grid-pager">
    <div class="pager-dot active"></div>
    <div class="pager-dot"></div>
  </div>
</div>

<!-- 保险理财入口 Banner -->
<a class="insurance-banner" href="../kuaishou-active-bao/index.html" id="ins-banner">
  <div class="ib-left">
    <div class="ib-tag">🏆 快手小金保·严选</div>
    <div class="ib-title">存余额·享高收益</div>
    <div class="ib-desc">灵活存取 · 日日正收益</div>
    <div class="earn-hint" id="earn-hint-text">你的余额存入后年化多赚 ¥-- 元</div>
  </div>
  <div class="ib-right">
    <div class="ib-rate" id="ib-rate-display">1.80<small style="font-size:16px;">%</small></div>
    <div class="ib-rate-label">近7日年化收益</div>
    <div class="ib-btn">立即存入</div>
  </div>
</a>

<!-- 天天赚余额 -->
<div class="earn-card">
  <div class="earn-card-title">天天赚余额</div>
  <div class="earn-tabs">
    <button class="earn-tab active">做任务</button>
    <button class="earn-tab inactive">笔笔返现</button>
  </div>
  <div class="earn-task-list">
    <div class="earn-task-item">
      <div>
        <span class="earn-task-desc">体验一笔小金保存款</span>
        <span class="earn-task-amount">+30.19元</span>
      </div>
      <button class="earn-task-btn" onclick="goToInsurance()">去完成</button>
    </div>
    <div class="earn-task-item">
      <div>
        <span class="earn-task-desc">开通储蓄险并学习</span>
        <span class="earn-task-amount">+30.27元</span>
      </div>
      <button class="earn-task-btn" onclick="goToInsurance()">去完成</button>
    </div>
    <div class="earn-task-item">
      <div>
        <span class="earn-task-desc">快手送你15元现金</span>
        <span class="earn-task-amount">+15元</span>
      </div>
      <button class="earn-task-btn" onclick="toast('活动即将开始，敬请期待')">去完成</button>
    </div>
  </div>
  <div class="earn-more">查看更多 ›</div>
</div>

<!-- 余额享福利 -->
<div class="benefit-card">
  <div class="benefit-title">余额享福利</div>
  <div style="font-size:13px;color:#888;padding:20px 0;text-align:center;">更多福利即将上线，敬请期待</div>
</div>

<div class="safe-bottom"></div>

<script>
  const BALANCE = 452.7;
  const FLEXIBLE_RATE = 1.80; // 近7日年化 %
  let balanceVisible = true;

  // 计算存入小金保后年化多赚（相比银行活期0.2%）
  const extraEarn = Math.round(BALANCE * (FLEXIBLE_RATE - 0.2) / 100);
  document.getElementById('earn-hint-text').textContent = `你的余额存入后年化多赚 ¥${extraEarn} 元`;

  function toggleBalance() {
    balanceVisible = !balanceVisible;
    document.getElementById('balance-display').textContent = balanceVisible ? BALANCE : '****';
    document.getElementById('eye-btn').textContent = balanceVisible ? '👁' : '🙈';
  }

  function goToInsurance() {
    window.location.href = '../kuaishou-active-bao/index.html';
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
